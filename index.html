<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sports Game Watch</title>
<style>
*{box-sizing:border-box}
:root{--bg:#080a0c;--panel:#101316;--panel2:#15191d;--line:#252a2f;--muted:#747b82;--text:#f5f6f7;--accent:#ff6a00;--accent2:#ff9b4a}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% -15%,rgba(255,106,0,.13),transparent 30%),
linear-gradient(180deg,#0b0d10 0%,#070809 100%);
color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 75%);z-index:-1}

header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:22px 34px 18px;background:rgba(8,10,12,.9);border-bottom:1px solid #20252a;backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.3)}
header>div:first-child{min-width:0}
h1{margin:0;font-size:31px;line-height:1;font-weight:950;letter-spacing:-1.5px}
.subtitle{margin-top:7px;font-size:9px;font-weight:900;letter-spacing:2px;color:#6f767d;text-transform:uppercase}
.live-pill{color:var(--accent);margin-right:7px}
.buttons{display:flex;gap:6px;margin-top:17px;flex-wrap:wrap}
button{border:1px solid #30363c;background:#111519;color:#8f969d;border-radius:7px;padding:8px 13px;font-weight:900;font-size:11px;letter-spacing:.5px;cursor:pointer;transition:.16s}
button:hover{background:#1a1f24;color:#fff;border-color:#485058}
button.active{background:var(--accent);border-color:var(--accent);color:#090a0b;box-shadow:0 5px 20px rgba(255,106,0,.2)}
#cycleBtn.running{background:#f1f3f4;color:#0a0b0c;border-color:#f1f3f4}
.status{font-size:10px;font-weight:950;letter-spacing:1.5px;color:var(--accent);text-align:right}
.updated{font-size:9px;color:#555d64;margin-top:6px;text-align:right}

main{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:32px 0 55px}
.title{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:#a3a9ae;font-size:10px;font-weight:950;letter-spacing:2px;text-transform:uppercase}
.title:before{content:"";width:18px;height:2px;background:var(--accent);box-shadow:8px 0 0 rgba(255,106,0,.3)}

.game{position:relative;display:grid;grid-template-columns:minmax(230px,1fr) 86px 28px 86px minmax(230px,1fr);align-items:center;gap:0;min-height:92px;margin:0 0 10px;padding:14px 24px;background:linear-gradient(100deg,#111518,#0d1013 55%,#111518);border:1px solid #242a2f;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden;transition:.18s}
.game:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.game:after{content:"";position:absolute;right:-100px;top:-80px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,106,0,.055),transparent 65%);pointer-events:none}
.game:hover{border-color:#3a4249;transform:translateY(-1px)}

.team{display:flex;align-items:center;gap:13px;min-width:0;height:58px;font-size:19px;font-weight:900;letter-spacing:.1px}
.team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.away{justify-content:flex-end;text-align:right;padding-right:18px}
.home{justify-content:flex-start;text-align:left;padding-left:18px}
.logo{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 7px #000)}
.score{font-size:42px;line-height:1;font-weight:950;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.scoreline{display:flex;justify-content:center;gap:8px}
.winning{color:var(--winner-color,#fff)}
.losing{color:#626970}
.tie{color:#fff}
.game-separator{font-size:24px;font-weight:800;color:#3f464c;text-align:center}
.game-details{grid-column:1/-1;text-align:center;margin-top:7px;padding-top:7px;border-top:1px solid #20262b}
.meta{font-size:9px;font-weight:900;letter-spacing:1px;color:#747c83;text-transform:uppercase}
.mlb-situation{margin:7px auto 0;max-width:380px;padding:7px 12px;background:#0a0d10;border:1px solid #20262a;border-radius:6px;color:#cbd0d4;font-size:11px;line-height:1.45}
.mlb-situation .pitcher{color:#8d959c}.mlb-situation .batter{font-weight:900}.mlb-situation .winner-pitcher{font-weight:900;color:#fff;margin-bottom:3px}

.progress-wrap{width:100%;max-width:220px;margin:8px auto 0}
.progress-track{height:5px;border-radius:99px;background:#080a0c;border:1px solid #252a2f;box-shadow:inset 0 2px 4px #000}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 9px rgba(255,106,0,.35);transition:width .5s ease}
.progress-label{margin-top:4px;color:#565e65;font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase}

.empty{padding:55px 25px;text-align:center;background:#0e1114;border:1px dashed #2c3339;border-radius:10px;color:#697178;font-size:12px}
.error{padding:16px;border-radius:8px;background:#180e0b;border:1px solid #4a2115;color:#ff8460;font-size:12px}

.homerun-alert,.strikeout-alert{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none;background:rgba(0,0,0,.5)}
.homerun-alert.show,.strikeout-alert.show{display:flex}
.homerun-alert.show{animation:alertFade 3.2s ease forwards}
.homerun-card{min-width:360px;max-width:80%;padding:27px 36px;text-align:center;border:1px solid var(--accent);border-radius:12px;background:#0e1114;box-shadow:0 20px 70px #000c,0 0 35px rgba(255,106,0,.18);animation:tankPop .8s cubic-bezier(.2,1.5,.4,1)}
.homerun-tank{font-size:70px;line-height:1;margin-bottom:8px;animation:tankRecoil .8s ease}
.homerun-label{font-size:32px;font-weight:950;letter-spacing:2px;color:var(--accent)}.homerun-team{font-size:16px;font-weight:800;margin-top:5px;color:#dfe2e4}
.strikeout-alert.show{animation:alertFade 2.5s ease forwards}
.strikeout-card{min-width:300px;max-width:75%;padding:25px 34px;text-align:center;border:1px solid #3d464e;border-radius:12px;background:#0e1114;box-shadow:0 20px 65px #000c;animation:kPop .65s cubic-bezier(.2,1.5,.4,1)}
.strikeout-k{font-size:94px;line-height:.9;font-weight:1000;letter-spacing:-5px;color:#f2f4f5;text-shadow:0 4px 20px #000;animation:kSlam .65s ease}
.strikeout-label{font-size:25px;font-weight:950;letter-spacing:2px;margin-top:8px}.strikeout-batter{font-size:14px;font-weight:700;color:#899199;margin-top:4px}
@keyframes kPop{0%{transform:scale(.35);opacity:0}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes kSlam{0%{transform:scale(2.2) rotate(-7deg);opacity:0}55%{transform:scale(.9) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes tankPop{0%{transform:scale(.35) translateY(35px);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes tankRecoil{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(-12px) rotate(-2deg)}55%{transform:translateX(7px) rotate(1deg)}}
@keyframes alertFade{0%,80%{opacity:1}100%{opacity:0}}

@media(max-width:1099px) and (min-width:651px){
 main{width:min(950px,calc(100% - 36px))}
 .game{grid-template-columns:minmax(160px,1fr) 70px 24px 70px minmax(160px,1fr);padding:14px 16px}
 .team{font-size:17px}.score{font-size:36px}.logo{width:44px;height:44px}
}
@media(max-width:650px){
 header{display:block;padding:15px 12px}
 header>div:last-child{position:absolute;right:12px;top:18px}
 h1{font-size:23px}.subtitle{font-size:8px}
 .buttons{margin-top:15px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
 button{flex:0 0 auto;min-height:39px}
 main{width:calc(100% - 14px);padding:20px 0 35px}
 .game{grid-template-columns:minmax(0,1fr) 40px 14px 40px minmax(0,1fr);min-height:72px;padding:9px 4px;border-radius:8px}
 .team{font-size:12px;gap:5px;height:40px}.away{padding-right:3px}.home{padding-left:3px}
 .logo{width:31px;height:31px}.score{font-size:27px}.game-separator{font-size:17px}
 .game-details{margin-top:5px;padding-top:6px}.meta{font-size:8px}
 .progress-wrap{max-width:170px}.mlb-situation{font-size:9px;padding:5px 7px}
}
</style>
<link rel="manifest" href="manifest.json">
<style id="team-search-favorite-style">
.team-search,.favorite-select{
  border:1px solid #30363c;background:#111519;color:#9aa1a8;
  border-radius:7px;padding:8px 11px;font-weight:900;font-size:11px;
  letter-spacing:.2px;outline:none;height:34px
}
.team-search{width:145px}
.team-search::placeholder{color:#646c73}
.team-search:focus,.favorite-select:focus{border-color:#56616a;color:#fff}



.favorite-game:before{width:5px!important}
.search-empty{padding:45px 20px;text-align:center;background:#0e1114;border:1px dashed #2c3339;border-radius:10px;color:#697178;font-size:12px}
@media(max-width:650px){
  .team-search{width:130px}
  
}
</style>

<style id="game-count-responsive">
/* Show 6 on PC, 5 on tablet, 5 on phone */
@media (min-width:1100px){
  .game-index-6,.game-index-7,.game-index-8,.game-index-9{display:none!important}
}
@media (min-width:651px) and (max-width:1099px){
  .game-index-5,.game-index-6,.game-index-7,.game-index-8,.game-index-9{display:none!important}
}
@media (max-width:650px){
  .game-index-5,.game-index-6,.game-index-7,.game-index-8,.game-index-9{display:none!important}
}
</style>
<style id="team-record-rank-style">
.team-info{display:flex;flex-direction:column;min-width:0;line-height:1.05}
.team-name-line{display:flex;align-items:center;gap:5px;min-width:0}
.team-rank{font-size:11px;font-weight:950;color:var(--orange);letter-spacing:.2px;flex:0 0 auto}
.team-record{margin-top:4px;font-size:8px;font-weight:850;letter-spacing:.7px;color:#626970;text-transform:uppercase}
@media(max-width:650px){
  .team-rank{font-size:8px}
  .team-record{font-size:7px;margin-top:3px}
}
</style>
<style id="team-gradient-score-style">
.score{
  position:relative;
  z-index:0;
  min-height:54px;
  min-width:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid color-mix(in srgb, var(--team-color,#30343a) 45%, #242a2f);
  border-radius:9px;
  background:linear-gradient(135deg,
    color-mix(in srgb, var(--team-color,#30343a) 32%, #0d1013),
    color-mix(in srgb, var(--team-color2,#101419) 22%, #0d1013) 70%,
    #0d1013);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.score.winning{
  border-color:var(--winner-color,var(--team-color));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 14px color-mix(in srgb,var(--winner-color,var(--team-color)) 18%,transparent);
}
@media(max-width:650px){
  .game{
    grid-template-columns:minmax(0,1fr) 46px 15px 46px minmax(0,1fr);
    min-height:88px;
    padding:11px 6px;
    margin-bottom:10px;
  }
  .team{font-size:12.5px;gap:6px;height:46px}
  .away{padding-right:4px}.home{padding-left:4px}
  .logo{width:34px;height:34px}
  .score{font-size:28px;min-width:44px;min-height:48px;border-radius:8px}
  .game-details{margin-top:6px;padding-top:7px}
}
</style>
<style id="score-flash-style">
@keyframes scoreFlash{
  0%{transform:scale(1);filter:brightness(1)}
  22%{transform:scale(1.18);filter:brightness(2)}
  55%{transform:scale(1.06);filter:brightness(1.45)}
  100%{transform:scale(1);filter:brightness(1)}
}
.score.scored{
  animation:scoreFlash .85s cubic-bezier(.2,.9,.3,1);
}
.score-plus{
  position:absolute;
  right:5px;
  top:3px;
  font-size:12px;
  line-height:1;
  font-weight:1000;
  color:var(--winner-color,var(--team-color,#fff));
  opacity:0;
  pointer-events:none;
}
.score.scored .score-plus{
  animation:plusPop .85s ease-out;
}
@keyframes plusPop{
  0%{opacity:0;transform:translateY(7px) scale(.6)}
  20%{opacity:1;transform:translateY(0) scale(1.15)}
  70%{opacity:1;transform:translateY(-3px) scale(1)}
  100%{opacity:0;transform:translateY(-9px) scale(.8)}
}
</style>
<style id="calendar-style">
.buttons{position:relative}
.calendar-popover{
  display:none;position:absolute;z-index:100;left:0;top:calc(100% + 8px);
  padding:8px;border:1px solid #2d3338;border-radius:9px;
  background:#0e1114;box-shadow:0 14px 32px rgba(0,0,0,.5);
  align-items:center;gap:6px
}
.calendar-popover.open{display:flex}
.calendar-popover span{
  height:32px;display:flex;align-items:center;padding:0 8px;
  border:1px solid #292f34;border-radius:7px;background:#15191d;
  color:#8b9298;font-size:9px;font-weight:950;letter-spacing:.8px
}
.calendar-popover input{
  height:32px;border:1px solid #30363c;border-radius:7px;
  background:#080b0d;color:#fff;padding:0 8px;font-weight:850;
  color-scheme:dark;outline:none
}
.calendar-popover input:focus{border-color:#666f77;box-shadow:0 0 0 2px rgba(255,255,255,.04)}
.calendar-popover button{min-height:32px;padding:0 9px}
@media(max-width:650px){
  .calendar-popover{
    position:fixed;left:10px;right:10px;top:auto;bottom:12px;
    justify-content:center;padding:10px
  }
  .calendar-popover input{flex:1;min-width:0}
}
</style>
<style id="hide-game-index">
.game-index-0::before,.game-index-1::before,.game-index-2::before,
.game-index-3::before,.game-index-4::before,.game-index-5::before,
.game-index-6::before,.game-index-7::before,.game-index-8::before,
.game-index-9::before{content:none!important}
</style>
<style id="mlb-name-style">
.mlb-situation{
  font-family:Inter,Arial,Helvetica,sans-serif;
  font-size:10px;
  font-weight:850;
  letter-spacing:.35px;
}
.mlb-situation .pitcher{
  color:#9aa2a9;
  font-size:9px;
  font-weight:850;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.mlb-situation .batter{
  color:#e7eaec;
  font-size:10px;
  font-weight:950;
  letter-spacing:.15px;
}
.mlb-situation .winner-pitcher{
  color:#f5f6f7;
  font-size:10px;
  font-weight:950;
  letter-spacing:.25px;
}
@media(max-width:650px){
  .mlb-situation .pitcher{font-size:8px}
  .mlb-situation .batter,.mlb-situation .winner-pitcher{font-size:9px}
}
</style>

<style id="closest-game-polish">
#games{
  transition:opacity .2s ease, transform .2s ease;
  will-change:opacity,transform;
}
#games.games-updating{
  opacity:.45;
  transform:translateY(3px);
}
.game{
  transition:opacity .28s ease,transform .28s ease,border-color .22s ease,box-shadow .22s ease;
}

/* #1 closest-game: a real animated line travels around the whole border. */
.game.closest-game{
  border-color:rgba(255,106,0,.32) !important;
  overflow:hidden;
}
.game.closest-game::before{
  content:"";
  position:absolute;
  inset:0;
  width:auto;
  height:auto;
  border-radius:10px;
  padding:2px;
  background:conic-gradient(
    from var(--closest-angle,0deg),
    transparent 0deg 285deg,
    rgba(255,106,0,.18) 305deg,
    #ff6a00 325deg 350deg,
    #ffd08a 356deg 360deg
  );
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:closestBorderSpin 2.3s linear infinite;
  z-index:20;
  pointer-events:none;
}
.game.closest-game::after{
  content:"";
  position:absolute;
  right:-100px;
  top:-80px;
  width:220px;
  height:220px;
  background:radial-gradient(circle,rgba(255,106,0,.055),transparent 65%);
  pointer-events:none;
  z-index:1;
}
@keyframes closestBorderSpin{
  to{--closest-angle:360deg}
}
@property --closest-angle{
  syntax:"<angle>";
  inherits:false;
  initial-value:0deg;
}

/* Tags for the #1 game. */
.closest-tags{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
  margin:5px 0 1px;
}
.closest-tag{
  display:inline-flex;
  align-items:center;
  min-height:17px;
  padding:2px 7px;
  border-radius:999px;
  border:1px solid rgba(255,106,0,.42);
  background:rgba(255,106,0,.08);
  color:#ff9a1f;
  font-size:8px;
  line-height:1;
  font-weight:950;
  letter-spacing:.65px;
  text-transform:uppercase;
}
.closest-tag.neutral{
  border-color:#30363b;
  background:#111518;
  color:#8b939a;
}

/* MLB rows stay aligned: logo | role | name. */
.mlb-situation{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.mlb-person{
  display:grid;
  grid-template-columns:22px 24px minmax(0,1fr);
  align-items:center;
  min-height:22px;
  text-align:left;
  font-family:Inter,Arial,Helvetica,sans-serif;
  font-size:10px;
  font-weight:850;
  letter-spacing:.25px;
}
.mlb-person-logo{
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
}
.mlb-person-logo img{
  width:18px;height:18px;object-fit:contain;
  filter:drop-shadow(0 2px 3px #000);
}
.mlb-person-label{
  color:#777f86;
  font-size:8px;
  font-weight:950;
  letter-spacing:.7px;
}
.mlb-person-name{
  color:#e5e8ea;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:900;
}
.mlb-person.pitcher .mlb-person-name{color:#c5cbd0}
.mlb-person.batter .mlb-person-name{color:#fff}
.mlb-person.winner-pitcher .mlb-person-name{color:#fff}

@media(max-width:650px){
  .mlb-person{font-size:9px;grid-template-columns:20px 22px minmax(0,1fr)}
  .mlb-person-logo{width:18px;height:18px}
  .mlb-person-logo img{width:16px;height:16px}
  .mlb-person-label{font-size:7px}
  .closest-tag{font-size:7px;padding:2px 6px}
}
@media(prefers-reduced-motion:reduce){
  .game.closest-game::before{animation:none}
  #games,.game{transition:none}
}
</style>

<style id="mlb-stat-polish">
.mlb-person{
  grid-template-columns:22px 24px minmax(0,1fr) auto !important;
}
.mlb-person-stat{
  color:#777f86;
  font-size:8px;
  font-weight:900;
  letter-spacing:.35px;
  white-space:nowrap;
  margin-left:6px;
}
@media(max-width:650px){
  .mlb-person{
    grid-template-columns:20px 22px minmax(0,1fr) auto !important;
  }
  .mlb-person-stat{
    font-size:7px;
    margin-left:4px;
  }
}
</style>

<style id="final-extra-polish">
.closest-tag.special{
  border-color:rgba(255,106,0,.58);
  background:rgba(255,106,0,.13);
  color:#ffad4d;
}
</style>

<style id="scoreboard-style">
.scoreboard-toggle{
  appearance:none;
  border:1px solid #2d3338;
  background:#101417;
  color:#929aa1;
  border-radius:7px;
  padding:5px 9px;
  margin:7px auto 0;
  display:block;
  font:900 8px/1 Inter,Arial,sans-serif;
  letter-spacing:.75px;
  cursor:pointer;
  transition:background .2s,border-color .2s,color .2s;
}
.scoreboard-toggle:hover,.scoreboard-toggle.open{
  border-color:rgba(255,106,0,.5);
  color:#ff9a1f;
  background:rgba(255,106,0,.07);
}
.scoreboard-toggle span{
  display:inline-block;
  margin-right:4px;
  transition:transform .2s;
}
.scoreboard-toggle.open span{transform:rotate(180deg)}
.scoreboard-wrap{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  transition:grid-template-rows .28s ease,opacity .2s ease,margin-top .28s ease;
  margin-top:0;
}
.scoreboard-wrap.open{
  grid-template-rows:1fr;
  opacity:1;
  margin-top:7px;
}
.scoreboard-panel{min-height:0;overflow:hidden}
.scoreboard-scroll{overflow-x:auto;scrollbar-width:thin}
.scoreboard-table{
  border-collapse:collapse;

<script>
const SOURCES={
  mlb:{name:"MLB",url:"https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",icon:"⚾"},
  cfb:{name:"COLLEGE FOOTBALL",url:"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard",icon:"🏈"},
  cbb:{name:"COLLEGE BASKETBALL",url:"https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard",icon:"🏀"},
  nfl:{name:"NFL",url:"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",icon:"🏈"}
};
function localDateString(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
let selectedSport="mlb";
let selectedDate=localDateString();
const REFRESH_MS=30000;
const CYCLE_MS=10000;
let cycleOn=false;
let cycleTimer=null;
let cycleIndex=0;
let currentEvents=[];
let previousMlbScores={};
let firstMlbLoad=true;
let scoreFlashState={};
let finalFlashState={};
let teamSearch="";



function safeName(value, fallback=""){
  if(typeof value==="string") return value;
  if(!value || typeof value!=="object") return fallback;
  return value.fullName || value.fullNameDisplay || value.displayName ||
         value.shortName || value.name || value.athlete?.fullName ||
         value.athlete?.displayName || fallback;
}

function showStrikeout(batter){
  const overlay=document.getElementById("strikeoutAlert");
  const label=document.getElementById("strikeoutBatter");
  const batterName=safeName(batter,"");
  label.textContent=batterName ? `${batterName} is retired` : "";
  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),2500);
}

function showHomerun(team){
  const overlay=document.getElementById("homerunAlert");
  const label=document.getElementById("homerunTeam");
  label.textContent=safeName(team,"A team")+" went yard!";
  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),3200);
}

async function detectHomeruns(events){
  if(!events?.length)return;

  for(const event of events){
    const gamePk=event?.gamePk || event?.id;
    if(!gamePk)continue;

    try{
      const res=await fetch(
        `https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`,
        {cache:"no-store"}
      );
      if(!res.ok)continue;

      const data=await res.json();
      const plays=data?.liveData?.plays?.allPlays || [];
      const recent=plays.slice(-12);

      let seen={};
          try{seen=JSON.parse(sessionStorage.getItem("closestGameHRs")||"{}");}catch(_){}

      for(const play of recent){
        const result=play?.result||{};
        const about=play?.about||{};
        const playId=about?.playId || `${gamePk}-${about?.atBatIndex}-${result?.description}`;

        if((result?.eventType==="home_run" || result?.eventType==="strikeout") && !seen[playId]){
          seen[playId]=Date.now();
          try{sessionStorage.setItem("closestGameHRs",JSON.stringify(seen));}catch(_){}

          const team = safeName(play?.team, safeName(play?.matchup?.batter, "A team"));

          if(result?.eventType==="home_run"){
            showHomerun(team);
          }else if(result?.eventType==="strikeout"){
            showStrikeout(safeName(play?.matchup?.batter, ""));
          }
        }
      }
    }catch(err){
      console.log("MLB play-by-play unavailable",err);
    }
  }
}

function scoreText(value){
  if(value===null || value===undefined || value==="") return "0";
  if(typeof value==="number" || typeof value==="string") return String(value);
  if(typeof value==="object"){
    return String(value.value ?? value.displayValue ?? value.score ?? value.current ?? 0);
  }
  return "0";
}

function num(x){
  const v=scoreText(x);
  const n=parseFloat(v);
  return Number.isFinite(n)?n:0;
}

function teamRank(t){
  const r=t?.curatedRank?.current ?? t?.rank ?? t?.team?.rank;
  const n=Number(r);
  // ESPN commonly uses 99 for an unranked team.
  return Number.isFinite(n) && n>=1 && n<=25 ? n : null;
}

function isRankedCollegeGame(event,sport){
  if(sport!=="cfb" && sport!=="cbb") return false;
  return (event?.competitions?.[0]?.competitors||[]).some(t=>teamRank(t)!==null);
}

function teamRecord(t){
  const records=t?.records;
  if(!Array.isArray(records)) return "";
  const preferred=records.find(r=>r?.type==="total") || records.find(r=>r?.summary) || records[0];
  return preferred?.summary || "";
}

function gameCloseness(event){
  const teams=event?.competitions?.[0]?.competitors||[];
  if(teams.length<2)return 999;
  return Math.abs(num(teams[0]?.score)-num(teams[1]?.score));
}

function gameScore(event,sport){
  const c=event?.competitions?.[0];
  const teams=c?.competitors||[];
  const scores=teams.map(t=>num(t.score));
  const diff=scores.length>=2?Math.abs(scores[0]-scores[1]):99;
  const st=c?.status?.type||{};
  const live=st.state==="in";
  let p=0;

  // Ranked college games get a strong priority boost, then closeness
  // determines the order among games in the same tier.
  if(isRankedCollegeGame(event,sport)) p+=1800;

  if(live)p+=1000;
  if(diff===0)p+=500;
  else if(diff===1)p+=420;
  else if(diff===2)p+=330;
  else if(diff===3)p+=260;
  else if(diff<=5)p+=150;
  else if(diff<=7)p+=60;

  const period=num(c?.status?.period);
  if(sport==="mlb"){
    if(period>=9)p+=350; else if(period>=7)p+=220; else if(period>=5)p+=80;
  }else if(sport==="cfb" || sport==="nfl"){
    if(period>=4)p+=350; else if(period>=3)p+=180;
  }else if(sport==="cbb"){
    if(period>=2)p+=300;
  }
  if(st.completed||st.state==="post")p-=1000;
  return p;
}

function gameProgress(event,sport){
  const c=event?.competitions?.[0];
  const s=c?.status?.type||{};
  if(s.state!=="in") return "";
  const period=Number(c?.status?.period||0);

  let pct=0, label="";
  if(sport==="mlb"){
    // Approximate game progress by inning; late innings appear nearly full.
    pct=Math.min(100,Math.max(5,(period/9)*100));
    label=period>=9 ? "9th+" : `${period}${period===1?"st":period===2?"nd":period===3?"rd":"th"} inning`;
  }else if(sport==="cfb" || sport==="nfl"){
    pct=Math.min(100,Math.max(5,((period-1)/4)*100));
    label=period>=4 ? "4th quarter" : `${period}${period===1?"st":period===2?"nd":period===3?"rd":"th"} quarter`;
  }else if(sport==="cbb"){
    pct=period>=2?75:35;
    label=period>=2?"2nd half":"1st half";
  }else{
    pct=Math.min(100,Math.max(5,(period/4)*100));
    label=`Period ${period}`;
  }
  return `<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${label}</div>
  </div>`;
}

function statusText(c,sport){
  const s=c?.status?.type||{};
  const period=Number(s.period||0);
  const completed=s.completed||s.state==="post";
  const detail=(s.shortDetail||s.detail||"").toUpperCase();

  if(sport==="mlb"){
    const extra=period>9;
    if(completed)return extra ? `FINAL / ${period}` : "FINAL";
    if(s.state==="in")return extra ? `${period}${period===10?"TH":"TH"} / EXTRA INNINGS` : (s.shortDetail||s.detail||"LIVE");
  }

  const regulation=sport==="cbb"?2:(sport==="cfb"?4:4);
  if(sport==="cbb" || sport==="cfb" || sport==="nfl"){
    const overtime=period>regulation || /(?:\bOT\b|OVERTIME)/.test(detail);
    if(overtime){
      const otNum=Math.max(1,period-regulation);
      const otLabel=otNum===1?"OT":`${otNum}OT`;
      return completed ? `FINAL / ${otLabel}` : otLabel;
    }
  }

  if(completed)return "FINAL";
  if(s.state==="in")return s.shortDetail||s.detail||"LIVE";
  const d=new Date(c?.date||Date.now());
  return "STARTS "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}

function mlbAthleteLogo(obj, competitors){
  const a=obj?.athlete || obj || {};
  const candidates=[
    a?.team?.logo,
    a?.team?.logos?.[0]?.href,
    obj?.team?.logo,
    obj?.team?.logos?.[0]?.href
  ].filter(Boolean);
  if(candidates[0]) return candidates[0];

  const aid=a?.team?.id || obj?.team?.id;
  if(aid){
    const match=(competitors||[]).find(t=>String(t?.team?.id)===String(aid));
    if(match?.team?.logo)return match.team.logo;
  }

  const abbr=(a?.team?.abbreviation||obj?.team?.abbreviation||"").toLowerCase();
  if(abbr){
    const match=(competitors||[]).find(t=>
      String(t?.team?.abbreviation||"").toLowerCase()===abbr
    );
    if(match?.team?.logo)return match.team.logo;
  }
  return "";
}


function mlbAthleteStat(obj, keys){
  const a=obj?.athlete || obj || {};
  const sources=[obj?.statistics,obj?.stats,a?.statistics,a?.stats,a];
  for(const source of sources){
    if(!source)continue;
    for(const key of keys){
      const v=source?.[key];
      if(v!==undefined && v!==null && v!=="")return String(v);
    }
  }
  return "";
}

function mlbStatLine(obj, role){
  if(!obj)return "";
  const avg=role==="batter"
    ? mlbAthleteStat(obj,["avg","battingAverage","AVG"])
    : "";
  const era=role!=="batter"
    ? mlbAthleteStat(obj,["era","ERA","earnedRunAverage"])
    : "";
  const stat=avg || era;
  if(!stat)return "";
  return `<span class="mlb-person-stat">${role==="batter"?"AVG":"ERA"} ${stat}</span>`;
}

function mlbSituation(event){
  const c=event?.competitions?.[0];
  const s=c?.situation || event?.situation || {};
  const featured=c?.featuredAthletes || event?.featuredAthletes || [];
  const competitors=c?.competitors || [];

  const nameOf = x =>
    x?.athlete?.displayName || x?.athlete?.fullName ||
    x?.athlete?.shortName || x?.displayName || x?.fullName || "";

  const pitcherObj=s?.pitcher || featured.find(x =>
    x?.name==="pitcher" || x?.name==="currentPitcher"
  );
  const batterObj=s?.batter || featured.find(x =>
    x?.name==="batter" || x?.name==="currentBatter"
  );

  const pitcher=nameOf(pitcherObj);
  const batter=nameOf(batterObj);

  const wpObj=featured.find(x =>
    x?.name==="winningPitcher" ||
    x?.abbreviation==="WP" ||
    x?.displayName==="Winning Pitcher"
  );
  const winningPitcher=nameOf(wpObj);
  const completed=c?.status?.type?.completed || c?.status?.type?.state==="post";

  if(!pitcher && !batter && !winningPitcher)return "";

  const row=(cls,label,name,obj)=>{
    if(!name)return "";
    const logo=mlbAthleteLogo(obj,competitors);
    return `<div class="mlb-person ${cls}">
      <span class="mlb-person-logo">${logo?`<img src="${logo}" alt="">`:""}</span>
      <span class="mlb-person-label">${label}</span>
      <span class="mlb-person-name">${name}</span>
      ${mlbStatLine(obj,cls==="batter"?"batter":"pitcher")}
    </div>`;
  };

  return `<div class="mlb-situation">
    ${completed && winningPitcher ? row("winner-pitcher","WP",winningPitcher,wpObj) : ""}
    ${row("pitcher","P",pitcher,pitcherObj)}
    ${row("batter","AB",batter,batterObj)}
  </div>`;
}
function teamName(t){
  return t?.team?.abbreviation||t?.team?.shortDisplayName||t?.team?.displayName||"Team";
}

function scoreColor(team){
  return team?.team?.color ? "#" + team.team.color.replace("#","") : "#fff";
}
function teamColor(team){
  return team?.team?.color ? "#" + team.team.color.replace("#","") : "#30343a";
}
function teamColor2(team){
  const c=team?.team?.alternateColor || team?.team?.color;
  return c ? "#" + c.replace("#","") : "#101419";
}

function scoreMarkup(away, home){
  const a=num(away?.score), h=num(home?.score);
  if(a>h) return `<span class="winning" style="--winner-color:${scoreColor(away)}">${a}</span> — <span class="losing">${h}</span>`;
  if(h>a) return `<span class="losing">${a}</span> — <span class="winning" style="--winner-color:${scoreColor(home)}">${h}</span>`;
  return `<span class="tie">${away?.score??"—"} — ${home?.score??"—"}</span>`;
}

function allTeamOptions(events){
  const map=new Map();
  (events||[]).forEach(e=>{
    (e?.competitions?.[0]?.competitors||[]).forEach(t=>{
      const name=teamName(t);
      const key=(name||"").toLowerCase();
      if(name && key) map.set(key,name);
    });
  });
  return [...map.values()].sort((a,b)=>a.localeCompare(b));
}

function matchesTeam(event,query){
  if(!query)return true;
  const q=query.toLowerCase().trim();
  const teams=event?.competitions?.[0]?.competitors||[];
  return teams.some(t=>{
    const full=t?.team?.displayName||"";
    const short=teamName(t);
    const city=t?.team?.location||"";
    return [full,short,city].some(v=>(v||"").toLowerCase().includes(q));
  });
}



function mlbExtraTag(event){
  const c=event?.competitions?.[0];
  const st=c?.status?.type||{};
  const detail=(st.shortDetail||st.detail||"").toUpperCase();
  const period=Number(c?.status?.period||st.period||0);
  const extra=/EXTRA INN|EXTRA-INN|^10TH|^11TH|^12TH|^13TH|^14TH|^15TH|^16TH|^17TH|^18TH|^19TH|^20TH/.test(detail)||period>9;
  if(!extra)return "";
  const m=detail.match(/\b(1[0-9]|20)TH\b/);
  const inning=m?m[1]+"TH":(period>9?period+"TH":"");
  return `<span class="closest-tag special">EXTRA INNINGS</span>`;
}

function closestTags(event,sport,index){
  if(index!==0)return "";
  const c=event?.competitions?.[0];
  const st=c?.status?.type||{};
  const detail=(st.shortDetail||st.detail||"").toUpperCase();
  const anyLive=(window.__closestGames||[]).some(g=>{
    const t=g?.competitions?.[0]?.status?.type||{};
    return t.state==="in";
  });
  const tags=[`<span class="closest-tag">${anyLive?"#1 CLOSEST":"FIRST START"}</span>`];
  if(st.state==="in")tags.push('<span class="closest-tag">LIVE</span>');
  if(/\bOT\b|OVERTIME/.test(detail))tags.push('<span class="closest-tag">OT</span>');
  const extraTag=mlbExtraTag(event);
  if(extraTag)tags.push(extraTag);
  if(isRankedCollegeGame(event,sport)){
    tags.push('<span class="closest-tag neutral">RANKED</span>');
  }
  return `<div class="closest-tags">${tags.join("")}</div>`;
}


function scoreboardPeriodLabel(sport, period){
  if(sport==="mlb") return String(period);
  if(sport==="nfl" || sport==="cfb") return period<=4 ? `${period}Q` : "OT";
  if(sport==="nba" || sport==="ncaab") return period<=2 ? `${period}H` : `OT${period>3?period-2:""}`;
  return String(period);
}

function getScoreboardLines(event,sport){
  const c=event?.competitions?.[0];
  const comps=c?.competitors||[];
  const lines=comps.map(team=>{
    const ls=team?.linescores||[];
    return {
      team,
      scores:ls.map(x=>x?.value ?? x?.displayValue ?? "")
    };
  }).filter(x=>x.scores.length);

  if(!lines.length)return "";

  const max=Math.max(...lines.map(x=>x.scores.length));
  const current=Number(c?.status?.period||c?.status?.type?.period||0);

  let labels=[];
  for(let i=1;i<=max;i++) labels.push(scoreboardPeriodLabel(sport,i));
  if(sport==="mlb") labels.push("R");
  else if(sport==="nfl" || sport==="cfb") labels.push("T");
  else if(sport==="nba" || sport==="ncaab") labels.push("T");

  const totalFor=team=>team?.score ?? team?.score?.displayValue ?? "";
  return `<div class="scoreboard-panel">
    <div class="scoreboard-scroll">
      <table class="scoreboard-table">
        <thead><tr><th></th>${labels.map((l,i)=>{
          const active=(sport==="mlb"?i+1: i+1)===current && i<max;
          return `<th class="${active?"current-period":""}">${l}</th>`;
        }).join("")}</tr></thead>
        <tbody>
          ${lines.map(row=>{
            const vals=row.scores.slice();
            vals.push(totalFor(row.team));
            return `<tr>
              <td class="scoreboard-team">
                ${row.team?.team?.logo?`<img src="${row.team.team.logo}" alt="">`:""}
                <span>${row.team?.team?.abbreviation||row.team?.team?.shortDisplayName||""}</span>
              </td>
              ${vals.map((v,i)=>{
                const active=(i+1)===current && i<max;
                return `<td class="${active?"current-period":""}">${v}</td>`;
              }).join("")}
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function scoreboardButton(event,sport,index){
  const panel=getScoreboardLines(event,sport);
  if(!panel)return "";
  return `<button class="scoreboard-toggle" type="button" onclick="toggleScoreboard(this)" aria-expanded="false">
    <span>▾</span> SCOREBOARD
  </button><div class="scoreboard-wrap">${panel}</div>`;
}

function toggleScoreboard(button){
  const wrap=button.nextElementSibling;
  if(!wrap)return;
  const open=button.getAttribute("aria-expanded")==="true";
  button.setAttribute("aria-expanded",String(!open));
  button.classList.toggle("open",!open);
  wrap.classList.toggle("open",!open);
}

function render(events,sport){
  window.__closestGames=events||[];
  const valid=[...events]
    .filter(e=>e?.competitions?.[0]?.competitors?.length>=2)
    .filter(e=>matchesTeam(e,teamSearch))
    .sort((a,b)=>{
      const ca=a?.competitions?.[0], cb=b?.competitions?.[0];
      const sa=ca?.status?.type||{}, sb=cb?.status?.type||{};
      const liveA=sa.state==="in", liveB=sb.state==="in";
      const postA=sa.state==="post"||sa.completed, postB=sb.state==="post"||sb.completed;
      if(liveA!==liveB)return liveB-liveA;
      if(liveA && liveB){
        const cd=gameCloseness(a)-gameCloseness(b);
        if(cd!==0)return cd;
        const ga=gameScore(a,sport), gb=gameScore(b,sport);
        if(ga!==gb)return gb-ga;
      }
      if(!postA && !postB){
        const ta=Date.parse(ca?.date||"")||Infinity, tb=Date.parse(cb?.date||"")||Infinity;
        if(ta!==tb)return ta-tb;
      }
      if(postA!==postB)return postA-postB;
      const ar=isRankedCollegeGame(a,sport), br=isRankedCollegeGame(b,sport);
      if(ar!==br)return br-ar;
      return gameScore(b,sport)-gameScore(a,sport);
    });
  currentEvents=valid;

  const box=document.getElementById("games");
  if(!valid.length){
    box.innerHTML='<div class="empty">No games returned for this sport right now.</div>';
    return;
  }

  const startIndex=cycleOn ? (cycleIndex % valid.length) : 0;
  const shown=[];
  for(let i=0;i<Math.min(6,valid.length);i++) shown.push(valid[(startIndex+i)%valid.length]);

  box.classList.add("games-updating");
  setTimeout(()=>{
    box.innerHTML=shown.map((e,i)=>{
    const c=e.competitions[0];
    const teams=[...c.competitors];
    const away=teams.find(t=>t.homeAway==="away")||teams[0];
    const home=teams.find(t=>t.homeAway==="home")||teams[1];
    const a=num(away?.score), h=num(home?.score);

    const awayClass=a>h?"winning":(h>a?"losing":"tie");
    const homeClass=h>a?"winning":(a>h?"losing":"tie");

    const gameId=e.id||c.id||`${teamName(away)}-${teamName(home)}`;
    const prev=scoreFlashState[gameId]||{};
    const awayScored=Number.isFinite(a) && Number.isFinite(prev.away) && a>prev.away;
    const homeScored=Number.isFinite(h) && Number.isFinite(prev.home) && h>prev.home;
    const gameFinal=!!(c?.status?.type?.completed || c?.status?.type?.state==="post");
    const wasFinal=finalFlashState[gameId]===true;
    const justWentFinal=gameFinal && !wasFinal && Object.prototype.hasOwnProperty.call(finalFlashState,gameId);
    finalFlashState[gameId]=gameFinal;
    scoreFlashState[gameId]={away:a,home:h};
    const awayColor=a>h?`style="--winner-color:${scoreColor(away)};--team-color:${teamColor(away)};--team-color2:${teamColor2(away)}"`:`style="--team-color:${teamColor(away)};--team-color2:${teamColor2(away)}"`;
    const homeColor=h>a?`style="--winner-color:${scoreColor(home)};--team-color:${teamColor(home)};--team-color2:${teamColor2(home)}"`:`style="--team-color:${teamColor(home)};--team-color2:${teamColor2(home)}"`;

    return `<div class="game game-index-${i}${i===0 && events.some(g=>g?.competitions?.[0]?.status?.type?.state==="in")?" closest-game":""}">
      <div class="team away">
        <div class="team-info">
          <div class="team-name-line">
            ${teamRank(away)!==null ? `<span class="team-rank">#${teamRank(away)}</span>` : ""}
            <span>${teamName(away)}</span>
          </div>
          ${teamRecord(away) ? `<div class="team-record">${teamRecord(away)}</div>` : ""}
        </div>
        <img class="logo" src="${away?.team?.logo||""}" alt="">
      </div>
      <div class="score ${awayClass}${awayScored?" scored":""}${justWentFinal && a>h?" final-winner":""}" ${awayColor}>${scoreText(away?.score)}${awayScored?'<span class="score-plus">+</span>':""}</div>
      <div class="game-separator">—</div>
      <div class="score ${homeClass}${homeScored?" scored":""}${justWentFinal && h>a?" final-winner":""}" ${homeColor}>${scoreText(home?.score)}${homeScored?'<span class="score-plus">+</span>':""}</div>
      <div class="team home">
        <img class="logo" src="${home?.team?.logo||""}" alt="">
        <div class="team-info">
          <div class="team-name-line">
            ${teamRank(home)!==null ? `<span class="team-rank">#${teamRank(home)}</span>` : ""}
            <span>${teamName(home)}</span>
          </div>
          ${teamRecord(home) ? `<div class="team-record">${teamRecord(home)}</div>` : ""}
        </div>
      </div>
      <div class="game-details">
        ${scoreboardButton(e,sport,i)}
        
        ${closestTags(e,sport,i)}
        <div class="meta">${statusText(c,sport)}</div>
        ${gameProgress(e,sport)}
        ${sport==="mlb" ? mlbSituation(e) : ""}
      </div>
    </div>`;
    }).join("");
    requestAnimationFrame(()=>box.classList.remove("games-updating"));
  }, 70);
}

async function getGames(sport){
  const source=SOURCES[sport];
  const dateParam=selectedDate.replaceAll("-","");
  const r=await fetch(source.url+"?dates="+dateParam+"&_="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(source.name+" HTTP "+r.status);
  const d=await r.json();
  return (d.events||[]).map(e=>({...e,__sport:sport}));
}

async function resolveAutomaticDate(){
  const today=localDateString();

  // Never change the date when previewing the HTML directly from a file.
  if(location.protocol==="file:") return;

  // Only auto-roll when the user is currently on today's date.
  if(selectedDate!==today)return;

  try{
    const source=SOURCES[selectedSport==="all" ? "mlb" : selectedSport];
    const dateParam=today.replaceAll("-","");
    const r=await fetch(source.url+"?dates="+dateParam+"&_="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;

    const data=await r.json();
    const events=data.events||[];
    if(!events.length)return;

    const unfinished=events.some(e=>{
      const s=e?.competitions?.[0]?.status?.type||{};
      return s.state==="pre" || s.state==="in";
    });

    // Only move to tomorrow after every game today is finished.
    if(!unfinished){
      const tomorrow=new Date();
      tomorrow.setDate(tomorrow.getDate()+1);
      selectedDate=localDateString(tomorrow);
      const input=document.getElementById("gameDate");
      if(input)input.value=selectedDate;
      cycleIndex=0;
    }
  }catch(_){}
}

async function update(){
  const conn=document.getElementById("connection");
  const box=document.getElementById("games");
  try{
    await resolveAutomaticDate();
    if(selectedSport==="all"){
      const results=await Promise.allSettled(Object.keys(SOURCES).map(getGames));
      const good=results.filter(r=>r.status==="fulfilled").flatMap(r=>r.value);
      if(!good.length)throw new Error("None of the ESPN feeds responded.");
      const mlbGames=good.filter(e=>e.__sport==="mlb");
      if(mlbGames.length) detectHomeruns(mlbGames);
      render(good,"all");
      document.getElementById("sportTitle").textContent="SPORTS LIVE";
      const failed=results.filter(r=>r.status==="rejected").length;
      conn.textContent=failed?"● PARTIAL":"● LIVE";
    }else{
      const games=await getGames(selectedSport);
      if(selectedSport==="mlb") detectHomeruns(games);
      render(games,selectedSport);
      document.getElementById("sportTitle").textContent=SOURCES[selectedSport].name+" LIVE";
      conn.textContent="● LIVE";
    }
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});
  }catch(err){
    conn.textContent=location.protocol==="file:"?"LOCAL FILE":"OFFLINE";
    document.getElementById("updated").textContent="Could not load ESPN";
    box.innerHTML='<div class="error"><b>Could not load this ESPN feed.</b><br>'+err.message+(location.protocol==="file:"?'<br><br>You opened the downloaded HTML directly. Some browsers block live ESPN requests from local files. The GitHub version is the full live version.':'')+'</div>';
    console.error(err);
  }
}

(function(){

    const r=dateBtnEl.getBoundingClientRect();
    const menuW=Math.min(205,window.innerWidth-16);
    const menuH=Math.min(dateMenuEl.scrollHeight||205,window.innerHeight-16);
    const gap=6;

    dateMenuEl.style.width=menuW+"px";

    // Center the popup under the date button, then clamp it to the viewport.
    let left=r.left+(r.width-menuW)/2;
    left=Math.max(8,Math.min(left,window.innerWidth-menuW-8));

    const roomBelow=window.innerHeight-r.bottom;
    const roomAbove=r.top;

    dateMenuEl.classList.remove("flip-up");

    if(roomBelow >= menuH+gap || roomBelow >= roomAbove){
      dateMenuEl.style.left=left+"px";
      dateMenuEl.style.top=(r.bottom+gap)+"px";
      dateMenuEl.style.bottom="auto";
    }else{
      dateMenuEl.classList.add("flip-up");
      dateMenuEl.style.left=left+"px";
      dateMenuEl.style.bottom=(window.innerHeight-r.top+gap)+"px";
      dateMenuEl.style.top="auto";
    }
}

  dateBtnEl.addEventListener("click",()=>requestAnimationFrame(positionDateMenu));
  window.addEventListener("resize",positionDateMenu);
  window.addEventListener("scroll",positionDateMenu,true);
})();

</script>
<script>
if(location.protocol !== "file:" && "serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
<script id="install-app-script">
let deferredInstallPrompt=null;

window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  const area=document.getElementById("installArea");
  if(area)area.hidden=false;
});

document.getElementById("installBtn")?.addEventListener("click",async()=>{
  const area=document.getElementById("installArea");
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const result=await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    if(area && result?.outcome==="accepted")area.hidden=true;
    return;
  }

  // Fallback for browsers that don't expose the install prompt.
  let help=document.getElementById("installHelp");
  if(!help){
    help=document.createElement("div");
    help.id="installHelp";
    help.className="install-help";
    help.innerHTML="<b>Install Closest Game</b><br>In Chrome or Samsung Internet, open the browser menu and choose <b>Add to Home screen</b> or <b>Install app</b>.";
    area?.appendChild(help);
  }
});

window.addEventListener("appinstalled",()=>{
  const area=document.getElementById("installArea");
  if(area)area.hidden=true;
});
</script>
