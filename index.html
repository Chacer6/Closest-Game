<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sports Game Watch</title>
<style>
*{box-sizing:border-box}
:root{--bg:#080a0c;--panel:#101316;--panel2:#15191d;--line:#252a2f;--muted:#747b82;--text:#f5f6f7;--accent:#ff6a00;--accent2:#ff9b4a}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% -15%,rgba(255,106,0,.13),transparent 30%),
linear-gradient(180deg,#0b0d10 0%,#070809 100%);
color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 75%);z-index:-1}

header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:22px 34px 18px;background:rgba(8,10,12,.9);border-bottom:1px solid #20252a;backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.3)}
header>div:first-child{min-width:0}
h1{margin:0;font-size:31px;line-height:1;font-weight:950;letter-spacing:-1.5px}
.subtitle{margin-top:7px;font-size:9px;font-weight:900;letter-spacing:2px;color:#6f767d;text-transform:uppercase}
.live-pill{color:var(--accent);margin-right:7px}
.buttons{display:flex;gap:6px;margin-top:17px;flex-wrap:wrap}
button{border:1px solid #30363c;background:#111519;color:#8f969d;border-radius:7px;padding:8px 13px;font-weight:900;font-size:11px;letter-spacing:.5px;cursor:pointer;transition:.16s}
button:hover{background:#1a1f24;color:#fff;border-color:#485058}
button.active{background:var(--accent);border-color:var(--accent);color:#090a0b;box-shadow:0 5px 20px rgba(255,106,0,.2)}
#cycleBtn.running{background:#f1f3f4;color:#0a0b0c;border-color:#f1f3f4}
.status{font-size:10px;font-weight:950;letter-spacing:1.5px;color:var(--accent);text-align:right}
.updated{font-size:9px;color:#555d64;margin-top:6px;text-align:right}

main{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:32px 0 55px}
.title{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:#a3a9ae;font-size:10px;font-weight:950;letter-spacing:2px;text-transform:uppercase}
.title:before{content:"";width:18px;height:2px;background:var(--accent);box-shadow:8px 0 0 rgba(255,106,0,.3)}

.game{position:relative;display:grid;grid-template-columns:minmax(230px,1fr) 86px 28px 86px minmax(230px,1fr);align-items:center;gap:0;min-height:92px;margin:0 0 10px;padding:14px 24px;background:linear-gradient(100deg,#111518,#0d1013 55%,#111518);border:1px solid #242a2f;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden;transition:.18s}
.game:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.game:after{content:"";position:absolute;right:-100px;top:-80px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,106,0,.055),transparent 65%);pointer-events:none}
.game:hover{border-color:#3a4249;transform:translateY(-1px)}

.team{display:flex;align-items:center;gap:13px;min-width:0;height:58px;font-size:19px;font-weight:900;letter-spacing:.1px}
.team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.away{justify-content:flex-end;text-align:right;padding-right:18px}
.home{justify-content:flex-start;text-align:left;padding-left:18px}
.logo{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 7px #000)}
.score{font-size:42px;line-height:1;font-weight:950;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.scoreline{display:flex;justify-content:center;gap:8px}
.winning{color:var(--winner-color,#fff)}
.losing{color:#626970}
.tie{color:#fff}
.game-separator{font-size:24px;font-weight:800;color:#3f464c;text-align:center}
.game-details{grid-column:1/-1;text-align:center;margin-top:7px;padding-top:7px;border-top:1px solid #20262b}
.meta{font-size:9px;font-weight:900;letter-spacing:1px;color:#747c83;text-transform:uppercase}
.mlb-situation{margin:7px auto 0;max-width:380px;padding:7px 12px;background:#0a0d10;border:1px solid #20262a;border-radius:6px;color:#cbd0d4;font-size:11px;line-height:1.45}
.mlb-situation .pitcher{color:#8d959c}.mlb-situation .batter{font-weight:900}.mlb-situation .winner-pitcher{font-weight:900;color:#fff;margin-bottom:3px}

.progress-wrap{width:100%;max-width:220px;margin:8px auto 0}
.progress-track{height:5px;border-radius:99px;background:#080a0c;border:1px solid #252a2f;box-shadow:inset 0 2px 4px #000}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 9px rgba(255,106,0,.35);transition:width .5s ease}
.progress-label{margin-top:4px;color:#565e65;font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase}

.empty{padding:55px 25px;text-align:center;background:#0e1114;border:1px dashed #2c3339;border-radius:10px;color:#697178;font-size:12px}
.error{padding:16px;border-radius:8px;background:#180e0b;border:1px solid #4a2115;color:#ff8460;font-size:12px}

.homerun-alert,.strikeout-alert{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none;background:rgba(0,0,0,.5)}
.homerun-alert.show,.strikeout-alert.show{display:flex}
.homerun-alert.show{animation:alertFade 3.2s ease forwards}
.homerun-card{min-width:360px;max-width:80%;padding:27px 36px;text-align:center;border:1px solid var(--accent);border-radius:12px;background:#0e1114;box-shadow:0 20px 70px #000c,0 0 35px rgba(255,106,0,.18);animation:tankPop .8s cubic-bezier(.2,1.5,.4,1)}
.homerun-tank{font-size:70px;line-height:1;margin-bottom:8px;animation:tankRecoil .8s ease}
.homerun-label{font-size:32px;font-weight:950;letter-spacing:2px;color:var(--accent)}.homerun-team{font-size:16px;font-weight:800;margin-top:5px;color:#dfe2e4}
.strikeout-alert.show{animation:alertFade 2.5s ease forwards}
.strikeout-card{min-width:300px;max-width:75%;padding:25px 34px;text-align:center;border:1px solid #3d464e;border-radius:12px;background:#0e1114;box-shadow:0 20px 65px #000c;animation:kPop .65s cubic-bezier(.2,1.5,.4,1)}
.strikeout-k{font-size:94px;line-height:.9;font-weight:1000;letter-spacing:-5px;color:#f2f4f5;text-shadow:0 4px 20px #000;animation:kSlam .65s ease}
.strikeout-label{font-size:25px;font-weight:950;letter-spacing:2px;margin-top:8px}.strikeout-batter{font-size:14px;font-weight:700;color:#899199;margin-top:4px}
@keyframes kPop{0%{transform:scale(.35);opacity:0}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes kSlam{0%{transform:scale(2.2) rotate(-7deg);opacity:0}55%{transform:scale(.9) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes tankPop{0%{transform:scale(.35) translateY(35px);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes tankRecoil{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(-12px) rotate(-2deg)}55%{transform:translateX(7px) rotate(1deg)}}
@keyframes alertFade{0%,80%{opacity:1}100%{opacity:0}}

@media(max-width:1099px) and (min-width:651px){
 main{width:min(950px,calc(100% - 36px))}
 .game{grid-template-columns:minmax(160px,1fr) 70px 24px 70px minmax(160px,1fr);padding:14px 16px}
 .team{font-size:17px}.score{font-size:36px}.logo{width:44px;height:44px}
}
@media(max-width:650px){
 header{display:block;padding:15px 12px}
 header>div:last-child{position:absolute;right:12px;top:18px}
 h1{font-size:23px}.subtitle{font-size:8px}
 .buttons{margin-top:15px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
 button{flex:0 0 auto;min-height:39px}
 main{width:calc(100% - 14px);padding:20px 0 35px}
 .game{grid-template-columns:minmax(0,1fr) 40px 14px 40px minmax(0,1fr);min-height:72px;padding:9px 4px;border-radius:8px}
 .team{font-size:12px;gap:5px;height:40px}.away{padding-right:3px}.home{padding-left:3px}
 .logo{width:31px;height:31px}.score{font-size:27px}.game-separator{font-size:17px}
 .game-details{margin-top:5px;padding-top:6px}.meta{font-size:8px}
 .progress-wrap{max-width:170px}.mlb-situation{font-size:9px;padding:5px 7px}
}
</style>

.team-search:focus,.favorite-select:focus{border-color:#56616a;color:#fff}



.favorite-game:before{width:5px!important}

.team-info{display:flex;flex-direction:column;min-width:0;line-height:1.05}

.team-rank{font-size:11px;font-weight:950;color:var(--orange);letter-spacing:.2px;flex:0 0 auto}

<style id="score-flash-style">
@keyframes scoreFlash{
  0%{transform:scale(1);filter:brightness(1)}
  22%{transform:scale(1.18);filter:brightness(2)}
  55%{transform:scale(1.06);filter:brightness(1.45)}
  100%{transform:scale(1);filter:brightness(1)}
}
.score.scored{
  animation:scoreFlash .85s cubic-bezier(.2,.9,.3,1);
}
.score-plus{
  position:absolute;
  right:5px;
  top:3px;
  font-size:12px;
  line-height:1;
  font-weight:1000;
  color:var(--winner-color,var(--team-color,#fff));

  pointer-events:none;
}

  animation:plusPop .85s ease-out;
}
@keyframes plusPop{
  0%{opacity:0;transform:translateY(7px) scale(.6)}

<body>
<header>
  <div>
    <h1 id="sportTitle">MLB LIVE</h1><div class="subtitle"><span class="live-pill">● LIVE</span> CLOSEST GAME • LIVE SCOREBOARD</div>
    <div class="buttons">
      <button class="active" data-sport="mlb">⚾ MLB</button>
      <button data-sport="cfb">🏈 CFB</button>
      <button data-sport="nfl">🏈 NFL</button>
      <button data-sport="cbb">🏀 CBB</button>
      <button data-sport="all">🔥 ALL</button>
      <input id="teamSearch" class="team-search" type="search" placeholder="Search team…" autocomplete="off">
      <button id="cycleBtn">▶ CYCLE</button>
    </div>
  </div>
  <div>
    <div class="status" id="connection">CONNECTING</div>
    <div class="updated" id="updated">—</div>
  </div>
</header>
<div id="homerunAlert" class="homerun-alert" aria-live="polite">
  <div class="homerun-card">
    <div class="homerun-tank">🪖</div>
    <div class="homerun-label">HOME RUN!</div>
    <div class="homerun-team" id="homerunTeam"></div>
  </div>
</div>
<div id="strikeoutAlert" class="strikeout-alert" aria-live="polite">
  <div class="strikeout-card">
    <div class="strikeout-k">K</div>
    <div class="strikeout-label">STRIKEOUT!</div>
    <div class="strikeout-batter" id="strikeoutBatter"></div>
  </div>
</div>
<main>
  <div class="title" id="gameCountTitle">TOP GAMES</div>
  <div id="games"><div class="empty">Loading ESPN scores…</div></div>
</main>

<script>
const SOURCES={
  mlb:{name:"MLB",url:"https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",icon:"⚾"},
  cfb:{name:"COLLEGE FOOTBALL",url:"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard",icon:"🏈"},
  cbb:{name:"COLLEGE BASKETBALL",url:"https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard",icon:"🏀"},
  nfl:{name:"NFL",url:"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",icon:"🏈"}
};
let selectedSport="mlb";
const REFRESH_MS=30000;
const CYCLE_MS=10000;
let cycleOn=false;
let cycleTimer=null;
let cycleIndex=0;
let currentEvents=[];
let previousMlbScores={};
let firstMlbLoad=true;
let scoreFlashState={};
let teamSearch="";



function safeName(value, fallback=""){
  if(typeof value==="string") return value;
  if(!value || typeof value!=="object") return fallback;
  return value.fullName || value.fullNameDisplay || value.displayName ||
         value.shortName || value.name || value.athlete?.fullName ||
         value.athlete?.displayName || fallback;
}

function showStrikeout(batter){
  const overlay=document.getElementById("strikeoutAlert");
  const label=document.getElementById("strikeoutBatter");
  const batterName=safeName(batter,"");
  label.textContent=batterName ? `${batterName} is retired` : "";
  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),2500);
}

function showHomerun(team){
  const overlay=document.getElementById("homerunAlert");
  const label=document.getElementById("homerunTeam");
  label.textContent=safeName(team,"A team")+" went yard!";
  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),3200);
}

async function detectHomeruns(events){
  if(!events?.length)return;

  for(const event of events){
    const gamePk=event?.gamePk || event?.id;
    if(!gamePk)continue;

    try{
      const res=await fetch(
        `https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`,
        {cache:"no-store"}
      );
      if(!res.ok)continue;

      const data=await res.json();
      const plays=data?.liveData?.plays?.allPlays || [];
      const recent=plays.slice(-12);

      let seen={};
          try{seen=JSON.parse(sessionStorage.getItem("closestGameHRs")||"{}");}catch(_){}

      for(const play of recent){
        const result=play?.result||{};
        const about=play?.about||{};
        const playId=about?.playId || `${gamePk}-${about?.atBatIndex}-${result?.description}`;

        if((result?.eventType==="home_run" || result?.eventType==="strikeout") && !seen[playId]){
          seen[playId]=Date.now();
          try{sessionStorage.setItem("closestGameHRs",JSON.stringify(seen));}catch(_){}

          const team = safeName(play?.team, safeName(play?.matchup?.batter, "A team"));

          if(result?.eventType==="home_run"){
            showHomerun(team);
          }else if(result?.eventType==="strikeout"){
            showStrikeout(safeName(play?.matchup?.batter, ""));
          }
        }
      }
    }catch(err){
      console.log("MLB play-by-play unavailable",err);
    }
  }
}

function scoreText(value){
  if(value===null || value===undefined || value==="") return "0";
  if(typeof value==="number" || typeof value==="string") return String(value);
  if(typeof value==="object"){
    return String(value.value ?? value.displayValue ?? value.score ?? value.current ?? 0);
  }
  return "0";
}

function num(x){
  const v=scoreText(x);
  const n=parseFloat(v);
  return Number.isFinite(n)?n:0;
}

function teamRank(t){
  const r=t?.curatedRank?.current ?? t?.rank ?? t?.team?.rank;
  const n=Number(r);
  // ESPN commonly uses 99 for an unranked team.
  return Number.isFinite(n) && n>=1 && n<=25 ? n : null;
}

function isRankedCollegeGame(event,sport){
  if(sport!=="cfb" && sport!=="cbb") return false;
  return (event?.competitions?.[0]?.competitors||[]).some(t=>teamRank(t)!==null);
}

function teamRecord(t){
  const records=t?.records;
  if(!Array.isArray(records)) return "";
  const preferred=records.find(r=>r?.type==="total") || records.find(r=>r?.summary) || records[0];
  return preferred?.summary || "";
}

function gameCloseness(event){
  const teams=event?.competitions?.[0]?.competitors||[];
  if(teams.length<2)return 999;
  return Math.abs(num(teams[0]?.score)-num(teams[1]?.score));
}

function gameScore(event,sport){
  const c=event?.competitions?.[0];
  const teams=c?.competitors||[];
  const scores=teams.map(t=>num(t.score));
  const diff=scores.length>=2?Math.abs(scores[0]-scores[1]):99;
  const st=c?.status?.type||{};
  const live=st.state==="in";
  let p=0;

  // Ranked college games get a strong priority boost, then closeness
  // determines the order among games in the same tier.
  if(isRankedCollegeGame(event,sport)) p+=1800;

  if(live)p+=1000;
  if(diff===0)p+=500;
  else if(diff===1)p+=420;
  else if(diff===2)p+=330;
  else if(diff===3)p+=260;
  else if(diff<=5)p+=150;
  else if(diff<=7)p+=60;

  const period=num(c?.status?.period);
  if(sport==="mlb"){
    if(period>=9)p+=350; else if(period>=7)p+=220; else if(period>=5)p+=80;
  }else if(sport==="cfb" || sport==="nfl"){
    if(period>=4)p+=350; else if(period>=3)p+=180;
  }else if(sport==="cbb"){
    if(period>=2)p+=300;
  }
  if(st.completed||st.state==="post")p-=1000;
  return p;
}

function gameProgress(event,sport){
  const c=event?.competitions?.[0];
  const s=c?.status?.type||{};
  if(s.state!=="in") return "";
  const period=Number(c?.status?.period||0);

  let pct=0, label="";
  if(sport==="mlb"){
    // Approximate game progress by inning; late innings appear nearly full.
    pct=Math.min(100,Math.max(5,(period/9)*100));
    label=period>=9 ? "9th+" : `${period}${period===1?"st":period===2?"nd":period===3?"rd":"th"} inning`;
  }else if(sport==="cfb" || sport==="nfl"){
    pct=Math.min(100,Math.max(5,((period-1)/4)*100));
    label=period>=4 ? "4th quarter" : `${period}${period===1?"st":period===2?"nd":period===3?"rd":"th"} quarter`;
  }else if(sport==="cbb"){
    pct=period>=2?75:35;
    label=period>=2?"2nd half":"1st half";
  }else{
    pct=Math.min(100,Math.max(5,(period/4)*100));
    label=`Period ${period}`;
  }
  return `<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${label}</div>
  </div>`;
}

function statusText(c,sport){
  const s=c?.status?.type||{};
  const period=Number(s.period||0);
  const completed=s.completed||s.state==="post";
  const detail=(s.shortDetail||s.detail||"").toUpperCase();

  if(sport==="mlb"){
    const extra=period>9;
    if(completed)return extra ? `FINAL / ${period}` : "FINAL";
    if(s.state==="in")return extra ? `${period}${period===10?"TH":"TH"} / EXTRA INNINGS` : (s.shortDetail||s.detail||"LIVE");
  }

  const regulation=sport==="cbb"?2:(sport==="cfb"?4:4);
  if(sport==="cbb" || sport==="cfb" || sport==="nfl"){
    const overtime=period>regulation || /(?:\bOT\b|OVERTIME)/.test(detail);
    if(overtime){
      const otNum=Math.max(1,period-regulation);
      const otLabel=otNum===1?"OT":`${otNum}OT`;
      return completed ? `FINAL / ${otLabel}` : otLabel;
    }
  }

  if(completed)return "FINAL";
  if(s.state==="in")return s.shortDetail||s.detail||"LIVE";
  const d=new Date(c?.date||Date.now());
  return "STARTS "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}

function mlbSituation(event){
  const c=event?.competitions?.[0];
  const s=c?.situation || event?.situation || {};
  const featured=c?.featuredAthletes || event?.featuredAthletes || [];

  const nameOf = x =>
    x?.athlete?.displayName || x?.athlete?.fullName ||
    x?.athlete?.shortName || x?.displayName || x?.fullName || "";

  const pitcher=nameOf(s?.pitcher);
  const batter=nameOf(s?.batter);

  // ESPN's scoreboard puts the winning pitcher in featuredAthletes.
  const wpObj=featured.find(x =>
    x?.name==="winningPitcher" ||
    x?.abbreviation==="WP" ||
    x?.displayName==="Winning Pitcher"
  );
  const winningPitcher=nameOf(wpObj);

  // Also support the current pitcher/batter if ESPN exposes them there.
  const pitcherFeatured=featured.find(x =>
    x?.name==="pitcher" || x?.name==="currentPitcher"
  );
  const batterFeatured=featured.find(x =>
    x?.name==="batter" || x?.name==="currentBatter"
  );

  const p=pitcher || nameOf(pitcherFeatured);
  const b=batter || nameOf(batterFeatured);
  const completed=c?.status?.type?.completed || c?.status?.type?.state==="post";

  if(!p && !b && !winningPitcher)return "";

  return `<div class="mlb-situation">
    ${completed && winningPitcher ? `<div class="winner-pitcher">🏆 Winning Pitcher: ${winningPitcher}</div>` : ""}
    ${p ? `<div class="pitcher">⚾ P: ${p}</div>` : ""}
    ${b ? `<div class="batter">🔴 AB: ${b}</div>` : ""}
  </div>`;
}

function teamName(t){
  return t?.team?.abbreviation||t?.team?.shortDisplayName||t?.team?.displayName||"Team";
}

function scoreColor(team){
  return team?.team?.color ? "#" + team.team.color.replace("#","") : "#fff";
}
function teamColor(team){
  return team?.team?.color ? "#" + team.team.color.replace("#","") : "#30343a";
}
function teamColor2(team){
  const c=team?.team?.alternateColor || team?.team?.color;
  return c ? "#" + c.replace("#","") : "#101419";
}

function scoreMarkup(away, home){
  const a=num(away?.score), h=num(home?.score);
  if(a>h) return `<span class="winning" style="--winner-color:${scoreColor(away)}">${a}</span> — <span class="losing">${h}</span>`;
  if(h>a) return `<span class="losing">${a}</span> — <span class="winning" style="--winner-color:${scoreColor(home)}">${h}</span>`;
  return `<span class="tie">${away?.score??"—"} — ${home?.score??"—"}</span>`;
}

function allTeamOptions(events){
  const map=new Map();
  (events||[]).forEach(e=>{
    (e?.competitions?.[0]?.competitors||[]).forEach(t=>{
      const name=teamName(t);
      const key=(name||"").toLowerCase();
      if(name && key) map.set(key,name);
    });
  });
  return [...map.values()].sort((a,b)=>a.localeCompare(b));
}

function matchesTeam(event,query){
  if(!query)return true;
  const q=query.toLowerCase().trim();
  const teams=event?.competitions?.[0]?.competitors||[];
  return teams.some(t=>{
    const full=t?.team?.displayName||"";
    const short=teamName(t);
    const city=t?.team?.location||"";
    return [full,short,city].some(v=>(v||"").toLowerCase().includes(q));
  });
}

function render(events,sport){
  const valid=[...events]
    .filter(e=>e?.competitions?.[0]?.competitors?.length>=2)
    .filter(e=>matchesTeam(e,teamSearch))
    .sort((a,b)=>{
      // Closest score always comes first. Rankings are only a tie-breaker,
      // so a ranked blowout can never jump ahead of a genuinely close game.
      const cd=gameCloseness(a)-gameCloseness(b);
      if(cd!==0)return cd;

      const ar=isRankedCollegeGame(a,sport), br=isRankedCollegeGame(b,sport);
      if(ar!==br)return br-ar;

      const liveA=a?.competitions?.[0]?.status?.type?.state==="in";
      const liveB=b?.competitions?.[0]?.status?.type?.state==="in";
      if(liveA!==liveB)return liveB-liveA;

      return gameScore(b,sport)-gameScore(a,sport);
    });
  currentEvents=valid;

  const box=document.getElementById("games");
  if(!valid.length){
    box.innerHTML='<div class="empty">No games returned for this sport right now.</div>';
    return;
  }

  const startIndex=cycleOn ? (cycleIndex % valid.length) : 0;
  const shown=[];
  for(let i=0;i<Math.min(6,valid.length);i++) shown.push(valid[(startIndex+i)%valid.length]);

  box.innerHTML=shown.map((e,i)=>{
    const c=e.competitions[0];
    const teams=[...c.competitors];
    const away=teams.find(t=>t.homeAway==="away")||teams[0];
    const home=teams.find(t=>t.homeAway==="home")||teams[1];
    const a=num(away?.score), h=num(home?.score);

    const awayClass=a>h?"winning":(h>a?"losing":"tie");
    const homeClass=h>a?"winning":(a>h?"losing":"tie");

    const gameId=e.id||c.id||`${teamName(away)}-${teamName(home)}`;
    const prev=scoreFlashState[gameId]||{};
    const awayScored=Number.isFinite(a) && Number.isFinite(prev.away) && a>prev.away;
    const homeScored=Number.isFinite(h) && Number.isFinite(prev.home) && h>prev.home;
    scoreFlashState[gameId]={away:a,home:h};
    const awayColor=a>h?`style="--winner-color:${scoreColor(away)};--team-color:${teamColor(away)};--team-color2:${teamColor2(away)}"`:`style="--team-color:${teamColor(away)};--team-color2:${teamColor2(away)}"`;
    const homeColor=h>a?`style="--winner-color:${scoreColor(home)};--team-color:${teamColor(home)};--team-color2:${teamColor2(home)}"`:`style="--team-color:${teamColor(home)};--team-color2:${teamColor2(home)}"`;

    return `<div class="game game-index-${i}">
      <div class="team away">
        <div class="team-info">
          <div class="team-name-line">
            ${teamRank(away)!==null ? `<span class="team-rank">#${teamRank(away)}</span>` : ""}
            <span>${teamName(away)}</span>
          </div>
          ${teamRecord(away) ? `<div class="team-record">${teamRecord(away)}</div>` : ""}
        </div>
        <img class="logo" src="${away?.team?.logo||""}" alt="">
      </div>
      <div class="score ${awayClass}${awayScored?" scored":""}" ${awayColor}>${scoreText(away?.score)}${awayScored?'<span class="score-plus">+</span>':""}</div>
      <div class="game-separator">—</div>
      <div class="score ${homeClass}${homeScored?" scored":""}" ${homeColor}>${scoreText(home?.score)}${homeScored?'<span class="score-plus">+</span>':""}</div>
      <div class="team home">
        <img class="logo" src="${home?.team?.logo||""}" alt="">
        <div class="team-info">
          <div class="team-name-line">
            ${teamRank(home)!==null ? `<span class="team-rank">#${teamRank(home)}</span>` : ""}
            <span>${teamName(home)}</span>
          </div>
          ${teamRecord(home) ? `<div class="team-record">${teamRecord(home)}</div>` : ""}
        </div>
      </div>
      <div class="game-details">
        <div class="meta">${statusText(c,sport)}</div>
        ${gameProgress(e,sport)}
        ${sport==="mlb" ? mlbSituation(e) : ""}
      </div>
    </div>`;
  }).join("");
}

async function getGames(sport){
  const source=SOURCES[sport];
  const r=await fetch(source.url+"?_="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(source.name+" HTTP "+r.status);
  const d=await r.json();
  return (d.events||[]).map(e=>({...e,__sport:sport}));
}

async function update(){
  const conn=document.getElementById("connection");
  const box=document.getElementById("games");
  try{
    if(selectedSport==="all"){
      const results=await Promise.allSettled(Object.keys(SOURCES).map(getGames));
      const good=results.filter(r=>r.status==="fulfilled").flatMap(r=>r.value);
      if(!good.length)throw new Error("None of the ESPN feeds responded.");
      const mlbGames=good.filter(e=>e.__sport==="mlb");
      if(mlbGames.length) detectHomeruns(mlbGames);
      render(good,"all");
      document.getElementById("sportTitle").textContent="SPORTS LIVE";
      const failed=results.filter(r=>r.status==="rejected").length;
      conn.textContent=failed?"● PARTIAL":"● LIVE";
    }else{
      const games=await getGames(selectedSport);
      if(selectedSport==="mlb") detectHomeruns(games);
      render(games,selectedSport);
      document.getElementById("sportTitle").textContent=SOURCES[selectedSport].name+" LIVE";
      conn.textContent="● LIVE";
    }
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});
  }catch(err){
    conn.textContent="OFFLINE";
    document.getElementById("updated").textContent="Could not load ESPN";
    box.innerHTML='<div class="error"><b>Could not load this ESPN feed.</b><br>'+err.message+'<br><br>If the feed works in your browser but not from a local file, the browser may be blocking cross-origin requests.</div>';
    console.error(err);
  }
}

const cycleBtn=document.getElementById("cycleBtn");
cycleBtn.addEventListener("click",()=>{
  cycleOn=!cycleOn;
  cycleIndex=0;
  cycleBtn.classList.toggle("running",cycleOn);
  cycleBtn.textContent=cycleOn?"⏸ STOP":"▶ CYCLE";
  if(cycleTimer) clearInterval(cycleTimer);
  cycleTimer=null;
  if(cycleOn){
    cycleTimer=setInterval(()=>{
      if(!currentEvents.length)return;
      cycleIndex=(cycleIndex+3)%currentEvents.length;
      render(currentEvents, selectedSport);
    },CYCLE_MS);
  }
  render(currentEvents, selectedSport);
});

document.querySelectorAll("button[data-sport]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedSport=btn.dataset.sport;
    cycleIndex=0;
    document.querySelectorAll("button[data-sport]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    update();
  });
});

function updateGameCountTitle(){
  const title=document.getElementById("gameCountTitle");
  if(!title)return;
  const w=window.innerWidth;
  title.textContent=w<=650?"TOP 3 GAMES":(w<1100?"TOP 4 GAMES":"TOP 6 GAMES");
}
updateGameCountTitle();
window.addEventListener("resize",updateGameCountTitle);

const teamSearchInput=document.getElementById("teamSearch");
if(teamSearchInput){
  teamSearchInput.addEventListener("input",()=>{
    teamSearch=teamSearchInput.value;
    render(currentEvents,selectedSport);
  });
}


update();
setInterval(update,REFRESH_MS);
</script>
