<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sports Game Watch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f4f5f6;font-family:Inter,Arial,Helvetica,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,rgba(255,122,0,.10),transparent 34%),linear-gradient(180deg,#0d1014 0,#080a0d 100%);z-index:-1}
header{padding:18px 28px;border-bottom:1px solid #25292d;background:rgba(11,13,16,.94);display:flex;justify-content:space-between;gap:20px;align-items:center;position:sticky;top:0;z-index:5;backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.24)}
h1{margin:0;font-size:29px;letter-spacing:-.5px;font-weight:900}
.subtitle{font-size:10px;color:#70777d;letter-spacing:1.5px;margin-top:4px;font-weight:800}.live-pill{color:#f27b22;margin-right:7px;letter-spacing:.7px}
.buttons{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
#cycleBtn{border-color:#454b51}#cycleBtn.running{background:#f27b22;color:#0b0c0d;border-color:#f27b22}
.homerun-alert{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none;background:rgba(0,0,0,.42)}
.homerun-alert.show{display:flex;animation:alertFade 3.2s ease forwards}
.homerun-card{min-width:360px;max-width:80%;padding:26px 34px;text-align:center;border:1px solid #ff8a22;border-radius:20px;background:linear-gradient(145deg,#1c1d1e,#0d0e0f);box-shadow:0 15px 55px #000b,0 0 35px #ff7a0040;animation:tankPop .8s cubic-bezier(.2,1.5,.4,1)}
.homerun-tank{font-size:70px;line-height:1;margin-bottom:8px;animation:tankRecoil .8s ease}
.homerun-label{font-size:34px;font-weight:900;letter-spacing:2px;color:#ff8a22}.homerun-team{font-size:18px;font-weight:800;margin-top:5px;color:#eee}
.strikeout-alert{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none;background:rgba(0,0,0,.32)}
.strikeout-alert.show{display:flex;animation:alertFade 2.5s ease forwards}
.strikeout-card{min-width:300px;max-width:75%;padding:24px 32px;text-align:center;border:1px solid #59616a;border-radius:18px;background:linear-gradient(145deg,#171b20,#0b0e11);box-shadow:0 15px 50px #000b;animation:kPop .65s cubic-bezier(.2,1.5,.4,1)}
.strikeout-k{font-size:92px;line-height:.9;font-weight:1000;letter-spacing:-4px;color:#f2f4f5;text-shadow:0 4px 20px #000;animation:kSlam .65s ease}
.strikeout-label{font-size:27px;font-weight:900;letter-spacing:2px;margin-top:8px}.strikeout-batter{font-size:16px;font-weight:700;color:#aeb4ba;margin-top:4px}
@keyframes kPop{0%{transform:scale(.35);opacity:0}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes kSlam{0%{transform:scale(2.2) rotate(-7deg);opacity:0}55%{transform:scale(.9) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes tankPop{0%{transform:scale(.35) translateY(35px);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes tankRecoil{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(-12px) rotate(-2deg)}55%{transform:translateX(7px) rotate(1deg)}}
@keyframes alertFade{0%,80%{opacity:1}100%{opacity:0}}
button{border:1px solid #2c3136;background:#15191d;color:#9ca2a8;border-radius:8px;padding:8px 13px;font-weight:800;cursor:pointer;transition:.16s;letter-spacing:.2px}
button:hover{background:#1b2025;border-color:#474e55;color:#fff}
button.active{background:#f27b22;color:#0a0c0e;border-color:#f27b22;box-shadow:0 4px 16px rgba(242,123,34,.22)}
.status{color:#ff8a22;font-weight:900;font-size:13px;letter-spacing:.8px}.updated{color:#666a6d;font-size:11px;margin-top:4px;text-align:right}
main{padding:30px 24px 45px;max-width:1080px;margin:auto}.title{font-size:12px;font-weight:800;letter-spacing:1.6px;color:#8f9499;margin-bottom:13px;display:flex;align-items:center;gap:9px}.title:before{content:"";width:4px;height:14px;background:#ff7a00;border-radius:99px;display:inline-block}
.game{background:#151515;border-radius:14px;padding:18px 20px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
.team{font-size:22px;font-weight:800;display:flex;align-items:center;gap:12px}.team span{letter-spacing:.2px}
.away{justify-content:flex-end;text-align:right}.home{justify-content:flex-start;text-align:left}
.logo{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 3px 7px #000)}
.score{font-size:38px;font-weight:900;text-align:center;white-space:nowrap;letter-spacing:0;font-variant-numeric:tabular-nums}.scoreline{display:contents}.scoreline>span{display:block;text-align:center;font-variant-numeric:tabular-nums}.scoreline>span:nth-child(2){font-size:28px;color:#666}.scoreline{display:flex;justify-content:center;gap:8px}.winning{color:var(--winner-color,#fff)}.losing{color:#777}.tie{color:#fff}
.game-details{grid-column:1 / -1;text-align:center;margin-top:5px;border-top:1px solid #22282d;padding-top:7px}.meta{text-align:center;color:#8f969d;font-size:11px;margin-top:3px;font-weight:800;letter-spacing:.6px}.status{letter-spacing:.4px}
.mlb-situation{margin:8px auto 0;text-align:center;font-size:12px;line-height:1.45;color:#d9dde0;background:#0d1115;border:1px solid #252c32;border-radius:8px;padding:7px 10px;max-width:360px}
.progress-wrap{width:100%;max-width:230px;margin:10px auto 0}.progress-track{height:8px;border-radius:99px;background:#090909;border:1px solid #303030;box-shadow:inset 0 2px 4px #000,0 2px 5px #000}.progress-fill{height:100%;border-radius:99px;background:linear-gradient(#ff9a3d,#ff7a00);box-shadow:0 1px 5px #ff7a0066, inset 0 1px 1px #ffd09b;transition:width .5s ease}.progress-label{font-size:10px;color:#777;text-align:center;margin-top:4px;letter-spacing:.5px}
.mlb-situation .pitcher{color:#bbb}.mlb-situation .batter{font-weight:700}.mlb-situation .winner-pitcher{font-weight:800;color:#fff;margin-bottom:3px}
.empty{color:#999;background:#121212;border:1px solid #262626;border-radius:16px;padding:34px;text-align:center;box-shadow:0 8px 28px #0008}
.error{color:#ff6b6b;background:#1a1010;border-radius:12px;padding:18px;margin-bottom:12px}
@media(max-width:650px){header{padding:15px;align-items:flex-start}.team{font-size:15px;gap:8px;height:46px}.away{padding-right:7px}.home{padding-left:7px}.score{font-size:28px}.game{grid-template-columns:minmax(100px,1fr) 45px 18px 45px minmax(100px,1fr);padding:12px 8px;gap:0}.game-separator{font-size:20px}.logo{width:36px;height:36px}h1{font-size:23px}.subtitle{font-size:9px}.updated{font-size:10px}.buttons{gap:5px}.buttons button{padding:7px 8px;font-size:11px}}
</style>
<link rel="manifest" href="manifest.json"></head>
<body>
<header>
  <div>
    <h1 id="sportTitle">MLB LIVE</h1><div class="subtitle"><span class="live-pill">● LIVE</span> CLOSEST GAME • LIVE SCOREBOARD</div>
    <div class="buttons">
      <button class="active" data-sport="mlb">⚾ MLB</button>
      <button data-sport="cfb">🏈 CFB</button>
      <button data-sport="cbb">🏀 CBB</button>
      <button data-sport="all">🔥 ALL</button>
      <button id="cycleBtn">▶ CYCLE</button>
    </div>
  </div>
  <div>
    <div class="status" id="connection">CONNECTING</div>
    <div class="updated" id="updated">—</div>
  </div>
</header>
<div id="homerunAlert" class="homerun-alert" aria-live="polite">
  <div class="homerun-card">
    <div class="homerun-tank">🪖</div>
    <div class="homerun-label">HOME RUN!</div>
    <div class="homerun-team" id="homerunTeam"></div>
  </div>
</div>
<div id="strikeoutAlert" class="strikeout-alert" aria-live="polite">
  <div class="strikeout-card">
    <div class="strikeout-k">K</div>
    <div class="strikeout-label">STRIKEOUT!</div>
    <div class="strikeout-batter" id="strikeoutBatter"></div>
  </div>
</div>
<main>
  <div class="title">TOP 3 GAMES</div>
  <div id="games"><div class="empty">Loading ESPN scores…</div></div>
</main>

<script>
const SOURCES={
  mlb:{name:"MLB",url:"https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",icon:"⚾"},
  cfb:{name:"COLLEGE FOOTBALL",url:"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard",icon:"🏈"},
  cbb:{name:"COLLEGE BASKETBALL",url:"https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard",icon:"🏀"}
};
let selectedSport="mlb";
const REFRESH_MS=30000;
const CYCLE_MS=10000;
let cycleOn=false;
let cycleTimer=null;
let cycleIndex=0;
let currentEvents=[];
let previousMlbScores={};
let firstMlbLoad=true;

function showStrikeout(batter){
  const overlay=document.getElementById("strikeoutAlert");
  const label=document.getElementById("strikeoutBatter");
  label.textContent=batter ? `${batter} is retired` : "";
  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),2500);
}

function showHomerun(team){
  const overlay=document.getElementById("homerunAlert");
  const label=document.getElementById("homerunTeam");
  label.textContent=(typeof team==="string"?team:"A team")+" went yard!";
  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),3200);
}

async function detectHomeruns(events){
  if(!events?.length)return;

  for(const event of events){
    const gamePk=event?.gamePk || event?.id;
    if(!gamePk)continue;

    try{
      const res=await fetch(
        `https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`,
        {cache:"no-store"}
      );
      if(!res.ok)continue;

      const data=await res.json();
      const plays=data?.liveData?.plays?.allPlays || [];
      const recent=plays.slice(-12);

      let seen={};
          try{seen=JSON.parse(sessionStorage.getItem("closestGameHRs")||"{}");}catch(_){}

      for(const play of recent){
        const result=play?.result||{};
        const about=play?.about||{};
        const playId=about?.playId || `${gamePk}-${about?.atBatIndex}-${result?.description}`;

        if((result?.eventType==="home_run" || result?.eventType==="strikeout") && !seen[playId]){
          seen[playId]=Date.now();
          try{sessionStorage.setItem("closestGameHRs",JSON.stringify(seen));}catch(_){}

          const team =
            play?.team?.name ||
            play?.matchup?.batter?.fullName ||
            play?.matchup?.batter?.fullNameDisplay ||
            "A team";

          if(result?.eventType==="home_run"){
            showHomerun(team);
          }else if(result?.eventType==="strikeout"){
            showStrikeout(
              play?.matchup?.batter?.fullName ||
              play?.matchup?.batter?.fullNameDisplay ||
              (typeof play?.matchup?.batter?.fullName === "string" ? play.matchup.batter.fullName : "") ||
              ""
            );
          }
        }
      }
    }catch(err){
      console.log("MLB play-by-play unavailable",err);
    }
  }
}

function num(x){const n=Number(x);return Number.isFinite(n)?n:0}

function gameScore(event,sport){
  const c=event?.competitions?.[0];
  const teams=c?.competitors||[];
  const scores=teams.map(t=>num(t.score));
  const diff=scores.length>=2?Math.abs(scores[0]-scores[1]):99;
  const st=c?.status?.type||{};
  const live=st.state==="in";
  let p=0;

  if(live)p+=1000;
  if(diff===0)p+=500;
  else if(diff===1)p+=420;
  else if(diff===2)p+=330;
  else if(diff===3)p+=260;
  else if(diff<=5)p+=150;
  else if(diff<=7)p+=60;

  const period=num(c?.status?.period);
  if(sport==="mlb"){
    if(period>=9)p+=350; else if(period>=7)p+=220; else if(period>=5)p+=80;
  }else if(sport==="cfb"){
    if(period>=4)p+=350; else if(period>=3)p+=180;
  }else if(sport==="cbb"){
    if(period>=2)p+=300;
  }
  if(st.completed||st.state==="post")p-=1000;
  return p;
}

function gameProgress(event,sport){
  const c=event?.competitions?.[0];
  const s=c?.status?.type||{};
  if(s.state!=="in") return "";
  const period=Number(c?.status?.period||0);

  let pct=0, label="";
  if(sport==="mlb"){
    // Approximate game progress by inning; late innings appear nearly full.
    pct=Math.min(100,Math.max(5,(period/9)*100));
    label=period>=9 ? "9th+" : `${period}${period===1?"st":period===2?"nd":period===3?"rd":"th"} inning`;
  }else if(sport==="cfb"){
    pct=Math.min(100,Math.max(5,((period-1)/4)*100));
    label=period>=4 ? "4th quarter" : `${period}${period===1?"st":period===2?"nd":period===3?"rd":"th"} quarter`;
  }else if(sport==="cbb"){
    pct=period>=2?75:35;
    label=period>=2?"2nd half":"1st half";
  }else{
    pct=Math.min(100,Math.max(5,(period/4)*100));
    label=`Period ${period}`;
  }
  return `<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${label}</div>
  </div>`;
}

function statusText(c){
  const s=c?.status?.type||{};
  if(s.completed||s.state==="post")return "FINAL";
  if(s.state==="in")return s.shortDetail||s.detail||"LIVE";
  const d=new Date(c?.date||Date.now());
  return "STARTS "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}

function mlbSituation(event){
  const c=event?.competitions?.[0];
  const s=c?.situation || event?.situation || {};
  const featured=c?.featuredAthletes || event?.featuredAthletes || [];

  const nameOf = x =>
    x?.athlete?.displayName || x?.athlete?.fullName ||
    x?.athlete?.shortName || x?.displayName || x?.fullName || "";

  const pitcher=nameOf(s?.pitcher);
  const batter=nameOf(s?.batter);

  // ESPN's scoreboard puts the winning pitcher in featuredAthletes.
  const wpObj=featured.find(x =>
    x?.name==="winningPitcher" ||
    x?.abbreviation==="WP" ||
    x?.displayName==="Winning Pitcher"
  );
  const winningPitcher=nameOf(wpObj);

  // Also support the current pitcher/batter if ESPN exposes them there.
  const pitcherFeatured=featured.find(x =>
    x?.name==="pitcher" || x?.name==="currentPitcher"
  );
  const batterFeatured=featured.find(x =>
    x?.name==="batter" || x?.name==="currentBatter"
  );

  const p=pitcher || nameOf(pitcherFeatured);
  const b=batter || nameOf(batterFeatured);
  const completed=c?.status?.type?.completed || c?.status?.type?.state==="post";

  if(!p && !b && !winningPitcher)return "";

  return `<div class="mlb-situation">
    ${completed && winningPitcher ? `<div class="winner-pitcher">🏆 Winning Pitcher: ${winningPitcher}</div>` : ""}
    ${p ? `<div class="pitcher">⚾ P: ${p}</div>` : ""}
    ${b ? `<div class="batter">🔴 AB: ${b}</div>` : ""}
  </div>`;
}

function teamName(t){
  return t?.team?.abbreviation||t?.team?.shortDisplayName||t?.team?.displayName||"Team";
}

function scoreColor(team){
  return team?.team?.color ? "#" + team.team.color.replace("#","") : "#fff";
}

function scoreMarkup(away, home){
  const a=num(away?.score), h=num(home?.score);
  if(a>h) return `<span class="winning" style="--winner-color:${scoreColor(away)}">${a}</span> — <span class="losing">${h}</span>`;
  if(h>a) return `<span class="losing">${a}</span> — <span class="winning" style="--winner-color:${scoreColor(home)}">${h}</span>`;
  return `<span class="tie">${away?.score??"—"} — ${home?.score??"—"}</span>`;
}

function render(events,sport){
  const valid=[...events]
    .filter(e=>e?.competitions?.[0]?.competitors?.length>=2)
    .sort((a,b)=>gameScore(b,sport)-gameScore(a,sport));
  currentEvents=valid;

  const box=document.getElementById("games");
  if(!valid.length){
    box.innerHTML='<div class="empty">No games returned for this sport right now.</div>';
    return;
  }

  const startIndex=cycleOn ? (cycleIndex % valid.length) : 0;
  const shown=[];
  for(let i=0;i<Math.min(3,valid.length);i++) shown.push(valid[(startIndex+i)%valid.length]);

  box.innerHTML=shown.map(e=>{
    const c=e.competitions[0];
    const teams=[...c.competitors];
    const away=teams.find(t=>t.homeAway==="away")||teams[0];
    const home=teams.find(t=>t.homeAway==="home")||teams[1];
    const a=num(away?.score), h=num(home?.score);

    const awayClass=a>h?"winning":(h>a?"losing":"tie");
    const homeClass=h>a?"winning":(a>h?"losing":"tie");
    const awayColor=a>h?`style="--winner-color:${scoreColor(away)}"`:"";
    const homeColor=h>a?`style="--winner-color:${scoreColor(home)}"`:"";

    return `<div class="game">
      <div class="team away">
        <span>${teamName(away)}</span>
        <img class="logo" src="${away?.team?.logo||""}" alt="">
      </div>
      <div class="score ${awayClass}" ${awayColor}>${away}</div>
      <div class="game-separator">—</div>
      <div class="score ${homeClass}" ${homeColor}>${h}</div>
      <div class="team home">
        <img class="logo" src="${home?.team?.logo||""}" alt="">
        <span>${teamName(home)}</span>
      </div>
      <div class="game-details">
        <div class="meta">${statusText(c)}</div>
        ${gameProgress(e,sport)}
        ${sport==="mlb" ? mlbSituation(e) : ""}
      </div>
    </div>`;
  }).join("");
}

async function getGames(sport){
  const source=SOURCES[sport];
  const r=await fetch(source.url+"?_="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(source.name+" HTTP "+r.status);
  const d=await r.json();
  return (d.events||[]).map(e=>({...e,__sport:sport}));
}

async function update(){
  const conn=document.getElementById("connection");
  const box=document.getElementById("games");
  try{
    if(selectedSport==="all"){
      const results=await Promise.allSettled(Object.keys(SOURCES).map(getGames));
      const good=results.filter(r=>r.status==="fulfilled").flatMap(r=>r.value);
      if(!good.length)throw new Error("None of the ESPN feeds responded.");
      const mlbGames=good.filter(e=>e.__sport==="mlb");
      if(mlbGames.length) detectHomeruns(mlbGames);
      render(good,"all");
      document.getElementById("sportTitle").textContent="SPORTS LIVE";
      const failed=results.filter(r=>r.status==="rejected").length;
      conn.textContent=failed?"● PARTIAL":"● LIVE";
    }else{
      const games=await getGames(selectedSport);
      if(selectedSport==="mlb") detectHomeruns(games);
      render(games,selectedSport);
      document.getElementById("sportTitle").textContent=SOURCES[selectedSport].name+" LIVE";
      conn.textContent="● LIVE";
    }
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});
  }catch(err){
    conn.textContent="OFFLINE";
    document.getElementById("updated").textContent="Could not load ESPN";
    box.innerHTML='<div class="error"><b>Could not load this ESPN feed.</b><br>'+err.message+'<br><br>If CBB works but MLB/CFB do not, your browser is likely blocking those cross-origin requests when this file is opened directly. Hosting the page locally over HTTP will fix that in most browsers.</div>';
    console.error(err);
  }
}

const cycleBtn=document.getElementById("cycleBtn");
cycleBtn.addEventListener("click",()=>{
  cycleOn=!cycleOn;
  cycleIndex=0;
  cycleBtn.classList.toggle("running",cycleOn);
  cycleBtn.textContent=cycleOn?"⏸ STOP":"▶ CYCLE";
  if(cycleTimer) clearInterval(cycleTimer);
  cycleTimer=null;
  if(cycleOn){
    cycleTimer=setInterval(()=>{
      if(!currentEvents.length)return;
      cycleIndex=(cycleIndex+3)%currentEvents.length;
      render(currentEvents, selectedSport);
    },CYCLE_MS);
  }
  render(currentEvents, selectedSport);
});

document.querySelectorAll("button[data-sport]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedSport=btn.dataset.sport;
    cycleIndex=0;
    document.querySelectorAll("button[data-sport]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    update();
  });
});

update();
setInterval(update,REFRESH_MS);
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script></body>
</html>
